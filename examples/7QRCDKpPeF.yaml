title: 化学链技术：铁铈载氧体的反应原理
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"化学链技术：铁铈载氧体的反应原理"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"化学链技术：铁铈载氧体的反应原理"，一句简短标语（如"氧在铁铈间往返，能量在循环中释放"），简单 SVG 插画（反应器/氧原子箭头），"开始探索"按钮滚动到交互区。顶部导航：反应演示 / 核心原理 / 应用优势 / 小测验。
  2. 交互区（核心）：一个开关（反应/停止）和一个滑块（1-9）表示循环次数；SVG 显示两个反应器（空气反应器/燃料反应器）和氧的往返箭头。开关打开时，箭头流动、载氧体颗粒变色，面板显示当前步骤（氧化/还原）与说明。"重置"按钮恢复默认值。
  3. 核心原理：3 张卡片（载氧体作用、氧化反应、还原反应），每张含简短说明和内联 SVG 图标。
  4. 应用优势：3 张卡片（高效燃烧、碳捕集、清洁能源），每张含 SVG 图标、名称和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
