title: 什么是扫雷游戏？
prompt: |
  请用单个 HTML 文件制作一个中文互动教学网页，主题为“什么是扫雷游戏？”。

  风格：复古科技风（深色背景，经典的灰白像素格调，点缀霓虹蓝），卡片式布局，使用简洁的内联 SVG 图标。

  顶部：标题“什么是扫雷游戏？”，一句标语（如“逻辑推理，避开地雷”），一个简单的扫雷网格示意图，以及“开始探索”按钮。顶部导航包含：扫雷体验 / 游戏规则 / 现实应用 / 随堂测验。

  扫雷体验（核心）：提供一个小型的简易扫雷互动区（5x5网格，包含3个地雷）。点击方块可以翻开，如果是地雷则显示爆炸图案；如果是数字则显示周围地雷的数量。包含一个“重新开始”按钮。

  游戏规则：3 张卡片（数字含义、标记地雷、胜利条件），每张带简短说明和简单的内联 SVG 图标。

  现实应用：3 张卡片（逻辑思维训练、算法设计入门、经典电脑游戏），带图标和一句话描述。

  随堂测验：3 道单选题，点击选项后立刻显示对错与解析，最后显示总分和“重新挑战”按钮。

  底部：版权信息与“返回顶部”链接。

  要求：所有 CSS 和 JS 都内联，不依赖外部资源，不发送网络请求。语义化 HTML，支持键盘操作，手机和电脑端自适应。
