id: regex-lab
title: 正则表达式实验室
prompt: |
  构建一个单文件正则表达式演练场（index.html），无需打包工具，帮助用户学习和测试正则表达式：
  - 输入项：模式、标志（g i m s u y）、测试文本区域，支持实时更新
  - 输出窗格：带分组颜色的高亮匹配、带索引和捕获组的匹配表格、使用常见标记的模式解释
  - 实用工具：快速插入常用标记（\d、\w、\s、[A-Z]、前瞻等）、复制/分享永久链接（模式+标志编码在 URL 哈希中）
  - 错误处理：对无效模式给出友好反馈，显示错误信息和光标位置
  - 用户体验：终端窗口风格、亮色/暗色切换（默认暗色）、清除按钮
screenshot_url: https://cdn.openai.com/devhub/gpt5prompts/regex-lab.png
