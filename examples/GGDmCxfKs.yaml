title: 德语名词基础：大写与性别
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"德语名词基础：大写与性别"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"德语名词基础：大写与性别"，一句简短标语（如"名词大写是规矩，der/die/das 是门道"），简单 SVG 插画（字母/词卡），"开始探索"按钮滚动到交互区。顶部导航：冠词演示 / 三大规则 / 常见例子 / 小测验。
  2. 交互区（核心）：一个开关（显示/隐藏）和一个滑块（1-9）切换示例名词；SVG 显示一个词卡。开关打开时，词卡发光，面板显示该名词的冠词（der/die/das）、大写形式和中文意思。"重置"按钮恢复默认值。
  3. 三大规则：3 张卡片（名词一律大写、阳性 der、阴性 die 与中性 das），每张含简短说明和内联 SVG 图标。
  4. 常见例子：3 张卡片（der Tisch、die Schule、das Buch），每张含 SVG 图标、单词和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
