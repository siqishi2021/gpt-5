title: 神秘的小伙伴：书包大变身
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"神秘的小伙伴：书包大变身"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"神秘的小伙伴：书包大变身"，一句简短标语（如"说清意图，让 AI 陪你写代码"），简单 SVG 插画（对话气泡/代码窗口），"开始探索"按钮滚动到交互区。顶部导航：提示演示 / 学习方法 / 实践场景 / 小测验。
  2. 交互区（核心）：一个开关（发送提示/等待）和一个滑块（1-4）切换提示词示例；SVG 显示对话气泡与代码块。开关打开时，气泡发光，面板显示该提示词与生成的代码结果。"重置"按钮恢复默认值。
  3. 学习方法：3 张卡片（描述需求、拆解任务、审查代码），每张含简短说明和内联 SVG 图标。
  4. 实践场景：3 张卡片（做小工具、改开源项目、快速原型），每张含 SVG 图标、名称和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。 UI language should be English.

