title: 欢迎来到 Python 循环世界
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"欢迎来到 Python 循环世界"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"欢迎来到 Python 循环世界"，一句简短标语（如"让代码替你重复劳动"），简单 SVG 插画（循环箭头/代码窗口），"开始探索"按钮滚动到交互区。顶部导航：循环演示 / 循环类型 / 实际应用 / 小测验。
  2. 交互区（核心）：一个开关（运行/暂停）和一个滑块（1-9）表示循环次数；SVG 显示循环箭头的流动。开关打开时，箭头节点依次发光，面板显示当前循环轮次和输出结果。"重置"按钮恢复默认值。
  3. 循环类型：3 张卡片（for 循环、while 循环、嵌套循环），每张含简短说明和内联 SVG 图标。
  4. 实际应用：3 张卡片（批量处理文件、遍历列表、生成图案），每张含 SVG 图标、名称和一句话简介。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
