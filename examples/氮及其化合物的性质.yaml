id: artisan-csa
title: 手工艺 CSA 农场
prompt: |
  标题：手工艺 CSA — 手绘风格农场落地页
  提示词：
  创建一个单页应用，使用单个 HTML 文件，为一个社区支持农业计划设计一个手绘水彩美学风格的页面。
  视觉效果：纸张纹理背景、墨水风格的 SVG 插图、温暖的衬线字体标题、柔和的大地色调；插图带有轻柔的视差效果。
  首屏：季节性篮子插图、简短宣传语、用于确认配送区域的邮编检查输入框；行动号召按钮“加入收获季”。
  分享区：季节盒子网格（春/夏/秋/冬），悬停时显示典型农产品提示；过敏原图标。
  套餐：周配/双周配滑块；价格实时更新；附加选项（鸡蛋、鲜花、面包）带开关按钮。
  地图：嵌入带配送半径叠加层的静态地图图片；自提点列表带距离标签。
  用户评价：卡片轮播，农民肖像以线描艺术形式呈现。
  常见问题 + 联系：带平滑展开/收起的折叠面板；简单的邮件表单；支持无障碍访问和键盘操作；完全响应式。
