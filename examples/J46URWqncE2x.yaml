title: 开篇：为什么值得学 GitHub
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"开篇：为什么值得学 GitHub"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"开篇：为什么值得学 GitHub"，一句简短标语（如"代码托管是起点，协作才是未来"），简单 SVG 插画（分支图/仓库图标），"开始探索"按钮滚动到交互区。顶部导航：协作演示 / 核心价值 / 应用场景 / 小测验。
  2. 交互区（核心）：一个开关（分支/合并）和一个滑块（1-5）表示提交次数；SVG 显示一条分支线。开关打开时，提交节点依次发光，面板显示当前提交信息与分支状态。"重置"按钮恢复默认值。
  3. 核心价值：3 张卡片（版本管理、多人协作、开源社区），每张含简短说明和内联 SVG 图标。
  4. 应用场景：3 张卡片（个人项目、团队开发、开源贡献），每张含 SVG 图标、名称和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
