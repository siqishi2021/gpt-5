id: lanqiu
title: 篮球技巧
prompt: |
  Create a single-page application in a single HTML file for an interactive educational page on "Basic Electronics". The UI language should be English.

  Visual: Modern tech style (dark background with neon blue/green accents), card-based layout with thin borders; inline SVG for icons and illustrations.

  Hero: Title "篮球技巧", a short tagline (e.g., "From electrons to circuits, power the future"), a simple circuit illustration, and a "Start Exploring" button scrolling to the interactive area. Top nav anchors: Interactive Circuit / Components / Applications / Quiz.

  Interactive Circuit (Core): A simple circuit simulator. Provide a toggle switch (On/Off) and a voltage slider (1V - 9V). On the right, an SVG showing a battery, a resistor, and a lightbulb. When the switch is on, the bulb lights up (color change/glow), and a data panel displays the current (simulated). A "Reset" button to restore defaults.

  Components: 3 knowledge cards (Resistor, Capacitor, LED), each with a short description and a simple inline SVG icon.

  Applications: 3 cards (Smartphones, Electric Vehicles, Smart Homes), each with an SVG icon, name, and a one-sentence description.

  Quiz: 3 multiple-choice questions. Instant feedback with explanations upon selection. Show final score and a "Try Again" button at the end.

  Footer: Copyright info and a "Back to Top" link.

  Requirements: All CSS and JS inlined, no external resources, no network requests. Semantic HTML, keyboard accessible, responsive on mobile and desktop (no horizontal scroll at 360px width).
