id: numberblocks-playground-cn
title: 数字方块游乐场 · 数字积木
prompt: |
  标题：数字方块游乐场 · 数字积木（NumberBlocks Playground 中文版）
  提示词：
  创建一个单页应用，使用单个 HTML 文件，实现一个基于 Matter.js 物理引擎的“数字方块”沙盒游乐场，所有界面文字需翻译为中文。
  
  视觉效果与核心机制：
  - 采用 Matter.js 2D 物理引擎，所有数字以带有面部表情的彩色方块形式呈现。
  - 每个方块的颜色由其数值决定（1=红、2=橙、3=黄、4=绿等），方块上绘制卡通眼睛、嘴巴和数字标签。
  - 支持多单位组合成复合形状（如 10 显示为 2x5 或 10x1 网格）。
  
  核心交互功能：
  - 点击预设按钮生成对应数字/字母/符号的方块（支持 1-10、π、A-Z、自定义输入）。
  - 排列模式切换：自动、竖排、横排、阶梯。
  - 特殊模式：变形模式（切换排列方式）、爆炸模式（拆分为 1）、旋转模式（旋转方块）、克隆模式（复制方块）。
  - 网格模式：将方块对齐到世界网格。
  - 时间停止：暂停/恢复物理模拟。
  - 重置视角、全部清除。
  
  物理与合并：
  - 方块受重力影响，可堆叠、碰撞。
  - 相同或兼容的方块靠近时会自动合并，数值相加并重新着色。
  - 支持负数、小数、分数的视觉表示。
  
  相机控制：
  - 鼠标拖拽平移、滚轮缩放。
  - 键盘 WASD/方向键平移。
  - 支持无限缩放（Z 键切换）。
  
  音频与语音：
  - 使用 Web Audio API 播放生成/删除音效。
  - 方块“说话”时显示对话气泡。
  - 支持背景音乐播放、进度条、音量控制。
  
  UI 布局：
  - 顶部横向滚动按钮区：预设数字生成按钮 + 自定义按钮。
  - 控制栏：排列菜单、模式按钮、时间控制、相机重置、清除、音乐面板。
  - HUD 元素：右上角显示当前高度（方块数）和帧率。
  - 右下角彩虹色水印。
  - 底部建议条（可关闭）。
  - 启动加载遮罩，包含“开始游戏”按钮。
  
  技术要求：
  - 使用 Matter.js 物理引擎（通过 import map 导入）。
  - 纯 HTML/CSS/JavaScript，无外部框架依赖。
  - 所有界面文字使用中文（按钮、提示、标签）。
  - 字体使用 Learninglings（自定义字体）回退至系统字体。
  - 完全响应式，适配桌面和移动端触屏操作。
  - 使用 Canvas 渲染，包含天空渐变、草地、地面等环境元素。
  
  特殊细节：
  - 高度指示器显示当前相机高度（以方块为单位）及所在区域（地面/虚空/彩色区等）。
  - 支持右键/双击/ Ctrl+点击 删除方块。
  - 数字 7 的方块呈现彩虹渐变效果。
  - 数字 2 佩戴紫色圆形眼镜。
  - 数字 67 呈现斗鸡眼 + 流口水表情。
  - 数字 69 会缓慢旋转并周期性播放笑声和 "nice" 音效。
