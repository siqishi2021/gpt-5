id: aQIXma
title: 初探《艽野尘梦》：尘封百年的西藏记忆
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"初探《艽野尘梦》：尘封百年的西藏记忆"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"初探《艽野尘梦》"，副标题"尘封百年的西藏记忆"，一句简短标语，简单 SVG 插画（雪山/经幡），"开始探索"按钮滚动到交互区。顶部导航：时代背景 / 人物与路线 / 精彩片段 / 小测验。
  2. 交互区（核心）：一个开关（显示/隐藏）和一个滑块（1-9）表示行进进度；SVG 显示简化地图上的路线；开关打开时，路线节点发光，面板显示当前地点/事件文字。"重置"按钮恢复默认值。
  3. 时代背景：3 张卡片（作者陈渠珍、清末民初、西藏地理），每张含简短说明和内联 SVG 图标。
  4. 精彩片段：3 张卡片（进藏之路、羌塘绝境、归途），每张含 SVG 图标、名称和一句话简介。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
