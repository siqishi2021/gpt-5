title: 初识魔方：结构与原理
prompt: |
  创建一个单页HTML文件，做一个介绍“初识魔方：结构与原理”的科普页面。中文界面。现代简约科技风：深色背景、蓝绿色霓虹点缀、卡片布局、细边框、内联SVG图标。
 页面结构：
 1. 顶部导航：锚点链接“结构 / 原理 / 玩法 / 小测验”
 2. Hero区：标题“初识魔方”、一句标语“从角块到中心，解开三阶的秘密”、一个简单魔方SVG插图、“开始探索”按钮滚动到下方
 3. 结构区：3张知识卡片（角块、棱块、中心块），每张含简短说明和内联SVG图标
 4. 原理区：3张卡片（颜色对面关系、转动记号、还原思路），各含一句说明和SVG图标
 5. 小测验：3道单选题，选择后立即显示对错和解析，最后显示得分和“再试一次”按钮
 6. 页脚：版权信息和“回到顶部”链接
 要求：所有CSS和JS内联，无外部资源，无语网络请求；语义化HTML，支持键盘操作，手机端360px宽度不出现横向滚动。
