id: you-vs-homer
title: 你 vs 荷马 — 中文版
prompt: |
  生成一个 "You vs Homer" 捉迷藏游戏的中文版 HTML 页面。
  
  游戏玩法：玩家选择巴特或荷马。荷马速度更快，需要抓住所有巴特；巴特可以嘲讽(T键)获得加速，但会暴露位置。支持多种游戏模式（经典、双重麻烦、子弹、感染、自定义等）和三张地图（默认、迷宫、实验室）。
  
  核心系统：
  - 物理碰撞、障碍物、AI 追逐/逃离逻辑
  - 商店系统：使用金币购买皮肤和道具（弹弓、蓄力弹弓、肾上腺素）
  - 库存系统：装备皮肤和道具
  - 角色等级系统：巴特/荷马升级解锁里程碑皮肤
  - 音量控制、存档/读档
  
  视觉风格：辛普森风格卡通渲染，Canvas 2D，俯视角。UI 采用圆角卡片和暖黄色强调色。
  
  界面文字：全部使用中文。
  
  技术要求：纯 HTML/CSS/JS，Matter.js 物理引擎（可选），Web Audio API。所有资源使用本地路径。
