title: 课程启航：重塑你的奥德赛
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"课程启航：重塑你的奥德赛"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"课程启航：重塑你的奥德赛"，一句简短标语（如"每一次出发，都是一场自我重塑"），简单 SVG 插画（帆船/航线/星辰），"开始探索"按钮滚动到交互区。顶部导航：航程演示 / 课程模块 / 学习收获 / 小测验。
  2. 交互区（核心）：一个开关（启航/停泊）和一个滑块（1-5）表示航程阶段；SVG 显示一条航线与途经节点。启航时，航线节点依次发光，面板显示当前阶段名称与学习要点。"重置"按钮恢复默认值。
  3. 课程模块：3 张卡片（认识自我、规划路径、行动与反思），每张含简短说明和内联 SVG 图标。
  4. 学习收获：3 张卡片（目标感、行动力、成长心态），每张含 SVG 图标、名称和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
