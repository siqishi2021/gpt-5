id: kinetic-typography-studio
title: 动态排版工作室
prompt: |
  标题：动态排版工作室
  提示词：
  创建一个单页应用，使用单个 HTML 文件，让用户设计和导出动画文字序列。
  时间轴编辑器：带有关键帧，控制位置、缩放、旋转、透明度、字母/单词偏移和字距；缓动曲线支持预设和自定义贝塞尔曲线
  动画预设：打字机、弹跳、液体、故障、淡入向上、按词/字母/行级联；逐字形交错控制
  音频响应模式：加载本地音频文件，自动检测节拍，将关键帧对齐到小节/节拍；实时预览带擦洗功能
  样式控制：字体选择器（系统字体 + 几个内置网络字体）、字重、斜体、填充/描边、渐变、阴影、动态模糊开关、背景颜色或图片
  布局工具：安全区域参考线、1:1/9:16/16:9 比例预设、边距、网格
  导出：MP4/WebM/GIF 或 PNG 序列；包含帧率和分辨率选项；渲染时不显示 UI 边框
  无障碍：键盘快捷键、焦点顺序、控件上的 ARIA 标签；prefers-reduced-motion 减少重效果
  响应式、支持触摸和鼠标操作；不使用外部 API
