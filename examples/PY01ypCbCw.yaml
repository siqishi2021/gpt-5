title: 初中作文：传统文化类记叙文的"组合拳"
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"初中作文：传统文化类记叙文的'组合拳'"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"传统文化类记叙文的'组合拳'"，一句简短标语（如"一招一式，写出文化味"），简单 SVG 插画（毛笔/卷轴），"开始探索"按钮滚动到交互区。顶部导航：写作招式 / 素材积累 / 范文片段 / 小测验。
  2. 交互区（核心）：一个开关（示范/关闭）和一个滑块（1-5）表示"组合拳"招式数量；SVG 显示几招连击的示意。开关打开时，招式节点发光，面板显示当前招式名称与要点。""重置"按钮恢复默认值。
  3. 写作招式：3 张卡片（细节描写、场景烘托、情感升华），每张含简短说明和内联 SVG 图标。
  4. 素材积累：3 张卡片（传统节日、非遗技艺、家风家训），每张含 SVG 图标、名称和一句话简介。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
