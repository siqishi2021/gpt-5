id: event-feedback
title: 活动反馈仪表板
prompt: |
  创建一个单页应用，使用单个 HTML 文件，提供以下功能，使用现代化、用户友好的 Web 前端组件，适合商业用户：
  - 显示一个大表格视图，列出所有数据库行。数据包括活动参与者反馈提交，列包括日期、活动名称、参与者姓名、评分和反馈内容
  - 反馈内容应稍长，但表格应能良好地展示它
  - 在顶部添加一个搜索栏，允许用户按关键词筛选条目
  - 在顶部放置一个带关闭按钮的“AI 摘要”区域
  - 用真实、随机生成的数据集填充表格，包含 30 条记录
  - 允许用户通过点击列标题对表格进行排序；表格应按升序或降序重新排列行，并用图标指示当前排序方向
  - 注意细节：确保布局和 UI 保持完整，颜色使用得当（单色调商业调色板是安全的选择，但可以发挥创意！），界面的任何部分都不应出现破损
