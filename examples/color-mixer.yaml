id: color-mixer
title: 颜色混合器
prompt: |
  生成一个颜色混合模拟器 HTML 页面。核心玩法：点击按钮生成彩色方块，方块受重力下落并堆叠。拖拽两个不同颜色的方块使其重叠，即可混合生成新颜色并解锁对应按钮。
  
  视觉风格：深色渐变背景，毛玻璃质感 UI 面板。方块带有圆角和轻微立体阴影。
  
  核心机制：
  - 初始解锁：红、橙、黄、绿、蓝、黑、白
  - 混合配方：红+蓝=紫，黑+白=灰，红+黑=褐红，白+红=粉，绿+蓝=青，黄+橙=金 等
  - 发现红橙黄绿蓝靛紫七色后自动解锁彩虹方块
  - 保存/加载进度至 localStorage
  - 颜色库弹窗展示所有已解锁颜色
  - 配方弹窗展示混合规则
  
  界面文字使用中文。
  
  技术要求：纯 HTML/CSS/JS，Canvas 2D 物理模拟（重力、碰撞、摩擦力），无需外部依赖。
