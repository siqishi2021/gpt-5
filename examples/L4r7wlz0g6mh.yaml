title: 开启 Python 编程之旅
prompt: |
  创建一个单页应用，使用单个 HTML 文件，为“Python 编程入门”做一个可交互的教学页面，中文界面。

  视觉：深色极客风（深蓝/深灰背景），代码高亮配色，卡片式布局，圆角细边框；图标用内联 SVG。

  首屏：标题“开启 Python 编程之旅”，一句引导语（用代码改变世界，从第一行 print 开始），一个终端/代码窗口插图，按钮“开始学习”滚动到互动区。顶部导航锚点：认识 Python / 互动代码 / 语法基础 / 小测验。

  互动代码（核心区）：提供一个简易的代码运行模拟器（不用真实后台）。左侧输入框（预置几行 Python 代码，如 print("Hello World")），右侧“运行”按钮。点击后，下方终端面板输出对应结果（前端写死几个简单的字符串匹配逻辑，如识别到 print 就输出内容）。有“重置代码”按钮。

  语法基础：3 张知识卡片（变量与数据类型、条件判断 if/else、循环 for/while），每张卡片配简短说明和一小段示例代码。

  生活/应用：3 张卡片（网站开发、数据分析、人工智能），每张有 SVG 图标、名称、一句话说明。

  小测验：3 道单选题，选后即时反馈对错和解析，答完显示得分和“重新作答”。

  页脚：版权信息和“返回顶部”。

  要求：单文件内联 CSS 和 JS，不引用外部资源，不发网络请求；语义化标签，键盘可操作，适配手机和桌面，360px 宽无横向滚动。
