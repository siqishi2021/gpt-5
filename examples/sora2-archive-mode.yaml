id: sora2-archive-mode
title: Sora 2 · AI 视频生成器 — 赛博故障归档模式
prompt: |
  标题：Sora 2 · AI 视频生成器 — [系统严重故障 / 归档只读模式]
  提示词：
  创建一个单页应用，使用单个 HTML 文件，为一个已下线的 AI 视频生成工具设计一个“赛博朋克故障美学”风格的归档落地页。
  
  视觉效果：纯黑背景配合低透明度红色矩阵数字雨（Canvas 实现）；故障撕裂效果（Glitch）应用于主标题；主色调为故障红（#ff3232）与深黑；字体采用无衬线字体与等宽字体混合；界面带有轻微的 CRT 扫描线质感。
  
  核心状态通知：页面中央或启动时必须展示醒目的“系统严重错误”卡片，明确告知生成引擎已永久离线。并提供一个高亮的 Discord 邀请区域，引导用户切换至 Discord 机器人使用（显示具体命令如 /sora2, /sora2pro 等）。
  
  首屏布局（归档模式）：
  - 侧边栏（桌面端）或底部导航（移动端）：包含“生成（禁用状态）”、“社区画廊”、“我的作品”、“在线用户”。
  - 主内容区默认展示“生成”标签页，但输入框和按钮均处于 disabled 且半透明不可用状态，按钮文字显示“引擎已离线”。
  
  画廊与历史功能（只读）：
  - 社区画廊：网格布局展示历史生成的视频卡片。卡片包含视频预览（懒加载）、提示词截断、用户头像、时间戳。需支持排序（最新/最多赞等）的模拟交互。
  - 我的作品：展示当前用户的公开及私密生成记录（利用 LocalStorage 模拟）。
  
  详情模态框：点击卡片弹出，支持视频播放、点赞/踩按钮、评论列表展示及发送评论（交互可为模拟/静态演示）。
  
  响应式要求：移动端通过底部固定导航切换标签，侧边栏自动隐藏；所有滚动区域需隐藏滚动条或使用极细滚动条。
  
  技术要求：使用纯 HTML/CSS/JavaScript 编写，包含 Canvas 矩阵背景动画，无需外部依赖（除字体和 Turnstile 脚本占位）。需确保页面加载时显示“启动遮罩层”，点击“进入归档”后消失。
