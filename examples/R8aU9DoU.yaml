title: 走进电路的世界：串联与并联
prompt: |
  请用单个 HTML 文件制作一个中文互动教学网页，主题为“走进电路的世界：串联与并联”。

  风格：现代科技风（深色背景，霓虹蓝/绿点缀），卡片式布局，使用简洁的内联 SVG 图标。

  顶部：标题“走进电路的世界”，一句标语（如“串联分压，并联分流，点亮科学之光”），一个简单的电路示意图，以及“开始探索”按钮。顶部导航包含：电路模拟 / 基础元件 / 现实应用 / 随堂测验。

  电路模拟（核心）：提供一个小型电路切换模拟器。包含一个“串联/并联”切换按钮，以及一个控制电源开关的按钮。右侧用 SVG 展示电池和 2 个灯泡的电路图。当切换到“串联”时，两个灯泡同时亮起；当切换到“并联”时，两个灯泡独立控制或同时亮起。下方的数据面板实时显示当前电路模式（串联/并联）和灯泡状态。

  基础元件：3 张卡片（电池、开关、导线），每张带简短说明和简单的内联 SVG 图标。

  现实应用：3 张卡片（节日彩灯、家庭电路、汽车车灯），带图标和一句话描述。

  随堂测验：3 道单选题，点击选项后立刻显示对错与解析，最后显示总分和“重新挑战”按钮。

  底部：版权信息与“返回顶部”链接。

  要求：所有 CSS 和 JS 都内联，不依赖外部资源，不发送网络请求。语义化 HTML，支持键盘操作，手机和电脑端自适应。
