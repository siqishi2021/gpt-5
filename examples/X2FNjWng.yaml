title: Photoshop 核心逻辑：图层与工作区
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"Photoshop 核心逻辑：图层与工作区"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"Photoshop 核心逻辑：图层与工作区"，一句简短标语（如"图层叠出秩序，工作区管好工具"），简单 SVG 插画（叠放的图层/工具栏），"开始探索"按钮滚动到交互区。顶部导航：图层演示 / 核心概念 / 实用技巧 / 小测验。
  2. 交互区（核心）：一个开关（显示/隐藏）和一个滑块（1-5）切换当前图层；SVG 显示几张叠放的图层。开关打开时，选中的图层高亮发光，面板显示该图层的名称、作用与操作提示。"重置"按钮恢复默认值。
  3. 核心概念：3 张卡片（图层叠加、图层顺序、可见性与锁定），每张含简短说明和内联 SVG 图标。
  4. 实用技巧：3 张卡片（图层分组、蒙版、调整图层），每张含 SVG 图标、名称和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
