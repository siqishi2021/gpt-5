id: ultimate-rage-clicker
title: 终极狂怒点击器
prompt: |
  1. 点击圆形面部增加狂怒值，狂怒值也会随时间自动增长
  2. 面部表情根据狂怒值实时演变：正常（蓝绿）→中性（黄橙）→愤怒（红紫，无限等级）→悲伤（负数值时）
  3. 愤怒时眉毛下压、嘴巴变大、瞳孔放大、面部抖动加速；悲伤时眉毛下垂、嘴巴下弯
  4. 升级系统：购买增加点击收益或每秒收益，成本递增
  5. 武器商店：一次性购买永久增加点击收益
  6. 奖励系统：游戏时长奖励 + 狂怒阈值奖励，无限延续
  7. 实时显示：狂怒值、心率、阶段、每点击/每秒收益、游戏时长、禁闭时间
  8. 支持数字格式化（千位分隔/缩写）和时间格式化
  9. 按钮：升级面板（底部滑出）、武器面板（右上弹出）、复活节彩蛋模式
  10. 调试功能：手动设置狂怒值、点击收益、每秒收益、游戏时长
  11. 点击有脉冲动画和浮动数字，购买有音效（Web Audio）
  12. 深色主题，全中文界面，纯HTML/CSS/JS无依赖

