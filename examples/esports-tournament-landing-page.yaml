id: esports-tournament-landing-page
title: 电竞赛事
prompt: |
  标题：电竞赛事
  提示词：
  创建一个单页应用，使用单个 HTML 文件，设计一个霓虹、高对比度的电竞赛事落地页。
  首屏：带扫描线效果的 3D/Canvas 动画背景；醒目标题、日期和行动号召按钮（“注册战队”、“获取门票”、“观看直播”）
  互动赛程表：8/16 支队伍的赛程表，带悬停状态、战队标志和比赛时间；自动演示模式
  赛程安排区：支持时区感知的比赛列表，带筛选器（阶段、日期）和“添加到日历”按钮（导出 ICS）
  战队卡片：队员名单、角色、国家旗帜、近期状态；响应式网格支持快速对比
  直播预览：嵌入式占位播放器，带“正在直播/即将开始”滚动条和赞助商轮播
  场馆与交通：地图图片、路线链接、酒店列表；无障碍和安全说明
  社交证明：用户评价、粉丝数量、近期精彩集锦轮播
  页脚：常见问题、规则 PDF 链接、行为准则、联系表单；移动端粘性“购票”行动号召按钮
  性能：图片懒加载、支持 prefers-reduced-motion；简洁、现代化、完全响应式
