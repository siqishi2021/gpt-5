id: pixel-world-conquest
title: 像素世界征服
prompt: |
  生成一个像素风格的国家征服模拟器 HTML 页面。核心玩法：基于世界地图像素网格，玩家点击空地建立国家。国家会自动扩张、相互征战、结盟、发生内战。
  
  视觉风格：像素化渲染，深色背景，霓虹色国家领土。左上角控制面板（年份显示、模拟速度滑块、暂停/继续、全部重置），右侧排行榜（世界列强），左下新闻滚动条，右下首都人口榜。鼠标悬停显示国家名称和稳定度。
  
  核心机制：
  - 国家自动向邻接空地扩张，速度受稳定度影响
  - 两国接壤时概率开战，领土较大方优势
  - 占领敌方首都触发征服波，快速吞并全国
  - 大国稳定度低时可能爆发内战分裂
  - 随机陨石撞击清空区域
  - 黄金时代加速扩张
  - 使用中文界面文字
  
  技术要求：纯 HTML/CSS/JS，使用 Canvas 2D 渲染像素图，无需外部依赖。世界地图使用 world_map.png（绿色为陆地，蓝色为海洋）。
