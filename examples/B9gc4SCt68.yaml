title: Welcome to the World of Electronics
prompt: |
   创建一个单页HTML文件，做一个介绍“电子技术的奇幻之旅：从电报到芯片”的科普页面。中文界面。现代简约科技风：深色背景、蓝绿霓虹点缀、卡片布局、细边框、内联SVG图标。

 页面结构：
 1. 顶部导航：锚点链接“发展历程 / 关键技术 / 现代应用 / 小测验”
 2. Hero区：标题“电子技术的奇幻之旅”、标语“从电报到芯片，一路点亮世界”、一个简单电路/芯片SVG插图、“开始探索”按钮滚动到下方
 3. 发展历程区：4张时间线卡片（电报、真空管、晶体管、集成电路），每张含年代、名称、一句说明和内联SVG图标
 4. 关键技术区：3张卡片（半导体、摩尔定律、光刻），各含简短说明和SVG图标
 5. 现代应用区：3张卡片（智能手机、电动汽车、智能家居），各含SVG图标、名称和一句说明
 6. 小测验：3道单选题，选择后立即显示对错和解析，最后显示得分和“再试一次”按钮
 7. 页脚：版权信息和“回到顶部”链接

 要求：所有CSS和JS内联，无外部资源，无网络请求；语义化HTML，支持键盘操作，手机端360px宽度不出现横向滚动。
