id: tic-tac-toe-game
title: 井字棋
prompt: |
  创建一个单页应用，使用单个 HTML 文件：
  一个罗马帝国主题的井字棋游戏，完全响应式，现代化。

  要求：
  - 全视口、流动式棋盘（基于 vmin）和移动/桌面响应式布局
  - 罗马主题：大理石背景、金色点缀、SPQR 徽章、微妙的斗兽场氛围
  - 简洁的顶栏，只有三个按钮：“新回合”、“自定义”、“重置分数”
  - 将所有选项放入“自定义”对话框中：
    • 主题：大理石日间 / 夜间军团
    • 符号：标准 X/O 或 短剑/桂冠
    • 模式：双人对战 或 对战 AI
    • 先手：X 或 O
    • AI 策略：完美 / 务实 / 鲁莽
  - 游戏逻辑：
    • 完美对局 AI 通过极小极大算法实现，带难度障碍
    • X、O 和平局的记分板
    • 金色胜利高亮 + 不重叠的胜利横幅（位于标题下方）
    • 基于 Canvas 的胜利彩纸效果（不喷 DOM 节点），尊重 prefers-reduced-motion
  - 无障碍：网格/单元格的 ARIA 角色、实时状态更新、键盘 + 触摸支持
  - 视觉效果：平滑的悬停/按压状态、柔和阴影、圆角、可缩放排版
  - 约束：无元素重叠或闪烁；无外部 JS 框架；单个 HTML 文件，内联 CSS/JS（允许使用 Google Fonts）
