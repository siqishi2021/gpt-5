title: 浮力：身边的“托举”力量
prompt: |
  创建一个单页应用，使用单个 HTML 文件，为初中物理“浮力”主题做一个可交互的教学页面，中文界面。

  视觉：浅蓝到浅青渐变背景，卡片式布局，圆角细边框轻阴影；插图和图标用内联 SVG，简洁水蓝配色。

  首屏：标题“浮力：身边的‘托举’力量”，一句引导语（为什么木块浮、铁块沉），一个水槽插图（木块浮、鸡蛋悬浮、铁块沉），按钮“开始探索”滚动到实验区。顶部导航锚点：互动实验 / 浮力公式 / 生活应用 / 小测验。

  互动实验：可选木块、鸡蛋、铁块三种物体；液体密度滑块 0.8–1.3 g/cm³，默认 1.0；点“放入水中”用动画展示上浮/悬浮/下沉，并显示浮力大小（F浮 = ρ液 g V排，g 取 9.8）。数据面板显示液体密度、物体密度、浮力、重力、浮沉状态。有“重置”按钮。

  公式区：卡片展示 F浮 = ρ液 g V排，解释各符号含义和单位，配一张浸入液体示意图，可展开收起推导过程。

  生活应用：轮船、潜水艇、热气球、死海漂浮四张卡片，每张有 SVG 插图、名称、一句话原理。

  小测验：3–5 道单选题，选后即时反馈对错和解析，答完显示得分和“重新作答”。

  页脚：版权信息和“返回顶部”。

  要求：单文件内联 CSS 和 JS，不引用外部资源，不发网络请求，不用 eval；语义化标签，键盘可操作，焦点可见，适配手机和桌面，360px 宽无横向滚动；尊重 prefers-reduced-motion，减少动画。
