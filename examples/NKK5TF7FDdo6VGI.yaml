title: 透镜的光学奥秘：从光线汇聚开始
prompt: |
  请用单个 HTML 文件制作一个中文互动教学网页，主题为“透镜的光学奥秘：从光线汇聚开始”。

  风格：现代科技风（深色背景，霓虹蓝/绿点缀），卡片式布局，使用简洁的内联 SVG 图标。

  顶部：标题“透镜的光学奥秘”，一句标语（如“一束光，一个焦点”），一个简单的凸透镜汇聚光线示意图，以及“开始探索”按钮。顶部导航包含：光线模拟 / 透镜类型 / 现实应用 / 随堂测验。

  光线模拟（核心）：提供一个小型光路模拟器。包含一个“重置”按钮，以及一个控制光源距离的滑块。右侧用 SVG 展示凸透镜及光线传播。调整滑块时，光线焦点和成像位置实时变化，面板同步显示焦距和物距数据。

  透镜类型：3 张卡片（凸透镜、凹透镜、放大镜），每张带简短说明和简单的内联 SVG 图标。

  现实应用：3 张卡片（近视眼镜、照相机镜头、望远镜），带图标和一句话描述。

  随堂测验：3 道单选题，点击选项后立刻显示对错与解析，最后显示总分和“重新挑战”按钮。

  底部：版权信息与“返回顶部”链接。

  要求：所有 CSS 和 JS 都内联，不依赖外部资源，不发送网络请求。语义化 HTML，支持键盘操作，手机和电脑端自适应。
