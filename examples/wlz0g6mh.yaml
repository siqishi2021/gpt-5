title: 开启 Python 编程之旅
prompt: |
  Create a single-page HTML file: an interactive educational page titled "开启 Python 编程之旅" (UI in Chinese).

  Style: dark background, neon blue/green accents, card layout, inline SVG icons.

  Sections:
  1. Hero: title "开启 Python 编程之旅", tagline, simple SVG illustration, "开始探索" button scrolling to interactive area. Top nav: 交互演示 / 核心概念 / 应用场景 / 小测验.
  2. Interactive: a toggle switch (开/关) and a slider (1-9). An SVG shows a battery, resistor and bulb. When on, bulb glows and a panel shows simulated current. "重置" button restores defaults.
  3. Concepts: 3 cards (变量, 循环, 函数), each with a short description and inline SVG icon.
  4. Applications: 3 cards (数据分析, 人工智能, 自动化脚本), each with SVG icon, name, one-sentence description.
  5. Quiz: 3 multiple-choice questions with instant feedback and explanations; show final score and "再试一次" button.
  6. Footer: copyright and "返回顶部" link.

  Requirements: all CSS/JS inline, no external resources, semantic HTML, keyboard accessible, responsive (no horizontal scroll at 360px).
