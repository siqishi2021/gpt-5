
id: LX2FNjWng
title: Photoshop 核心逻辑：图层与工作区
prompt: |
  创建一个单页应用，使用单个 HTML 文件，为“Photoshop 图层与工作区”做一个教学页面，中文界面。

  视觉：深灰专业风（类似 PS 软件界面），卡片式布局，面板边框清晰；图标用内联 SVG。

  首屏：标题“Photoshop 核心逻辑：图层与工作区”，一句引导语，一个图层/画布插图，按钮“开始探索”滚动到互动区。顶部导航锚点：认识图层 / 互动画布 / 工作区面板 / 小测验。

  互动画布（核心区）：提供一个简易的图层预览器。
  左侧是图层列表（如：背景层、文字层、形状层），每个图层带一个“眼睛”图标（显示/隐藏）。
  右侧是画布预览区，点击眼睛图标时，画布上对应的元素显示或隐藏（用前端 CSS 控制透明度即可）。附带一个“重置图层”按钮。

  工作区面板：3 张知识卡片（图层面板：上下层遮挡关系；工具栏：常用工具分类；属性面板：调整参数），每张配简短说明和 SVG 小图标。

  生活/应用：3 张卡片（海报设计、照片合成、UI 界面设计），每张有 SVG 图标、名称、一句话说明。

  小测验：3 道单选题，选后即时反馈对错和解析，答完显示得分和“重新作答”。

  页脚：版权信息和“返回顶部”。

  要求：单文件内联 CSS 和 JS，不引用外部资源，不发网络请求；语义化标签，键盘可操作，适配手机和桌面，360px 宽无横向滚动。
