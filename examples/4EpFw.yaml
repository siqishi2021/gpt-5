title: 课程导入：子网规划的意义
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"课程导入：子网规划的意义"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"课程导入：子网规划的意义"，一句简短标语（如"划分好网络，管理才高效"），简单 SVG 插画（网络节点/网段分区），"开始探索"按钮滚动到交互区。顶部导航：子网演示 / 核心概念 / 实际价值 / 小测验。
  2. 交互区（核心）：一个开关（划分子网/不划分）和一个滑块（1-4）表示子网数量；SVG 显示一个网络被划分成若干网段。开关打开时，各网段高亮，面板显示当前子网数量、每个子网的主机数与说明。"重置"按钮恢复默认值。
  3. 核心概念：3 张卡片（IP 地址、子网掩码、广播域），每张含简短说明和内联 SVG 图标。
  4. 实际价值：3 张卡片（减少广播、提升安全、便于管理），每张含 SVG 图标、名称和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
