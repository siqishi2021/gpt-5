title: 欢迎来到篮球规则课堂
prompt: |
  创建一个单页 HTML 文件：一个交互式教育页面，标题为"欢迎来到篮球规则课堂"，界面语言为中文。

  视觉风格：深色背景，霓虹蓝/绿点缀色，卡片式布局，内联 SVG 图标。

  页面区块：
  1. 首屏：标题"欢迎来到篮球规则课堂"，一句简短标语（如"看懂规则，才能打好比赛"），简单 SVG 插画（篮球与球场），"开始探索"按钮滚动到交互区。顶部导航：规则演示 / 基础规则 / 常见违例 / 小测验。
  2. 交互区（核心）：一个开关（进攻/防守）和一个滑块（1-5）表示比赛场景；SVG 显示半场球场与球员位置。开关打开时，相关区域或球员高亮，面板显示当前场景的规则要点。"重置"按钮恢复默认值。
  3. 基础规则：3 张卡片（得分规则、进攻时间、换人与犯规），每张含简短说明和内联 SVG 图标。
  4. 常见违例：3 张卡片（走步、二次运球、24 秒违例），每张含 SVG 图标、名称和一句话说明。
  5. 小测验：3 道单选题，选择后即时反馈并给出解析；最后显示总分和"再试一次"按钮。
  6. 页脚：版权信息和"返回顶部"链接。

  要求：所有 CSS 和 JS 内联，无外部资源、无网络请求；语义化 HTML；键盘可访问；移动端和桌面端响应式（360px 宽度下无横向滚动）。
