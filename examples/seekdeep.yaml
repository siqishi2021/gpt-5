title: 身边的“听话”小助手
prompt: |
  请用单个 HTML 文件制作一个中文互动教学网页，主题为“身边的‘听话’小助手”。

  风格：现代科技风（深色背景，霓虹蓝/紫点缀），卡片式布局，使用简洁的内联 SVG 图标。

  顶部：标题“身边的‘听话’小助手”，一句标语（如“一句话，让生活更智能”），一个简单的语音声波示意图，以及“开始探索”按钮。顶部导航包含：指令模拟 / 核心组件 / 现实应用 / 随堂测验。

  指令模拟（核心）：提供一个智能助手互动模拟器。包含 3 个快捷指令按钮（如“开灯”、“播放音乐”、“查天气”），以及一个模拟的语音输入框（可以纯前端模拟，无需真实录音）。右侧用 SVG 展示一个可爱的智能音箱。点击指令后，屏幕上出现对应动作的动画反馈（如灯泡发光、音符飘动），下方的数据面板显示当前状态（待机/正在执行）。

  核心组件：3 张卡片（麦克风、芯片、扬声器），每张带简短说明和简单的内联 SVG 图标。

  现实应用：3 张卡片（智能家居、车载语音、手机助手），带图标和一句话描述。

  随堂测验：3 道单选题，点击选项后立刻显示对错与解析，最后显示总分和“重新挑战”按钮。

  底部：版权信息与“返回顶部”链接。

  要求：所有 CSS 和 JS 都内联，不依赖外部资源，不发送网络请求。语义化 HTML，支持键盘操作，手机和电脑端自适应。
