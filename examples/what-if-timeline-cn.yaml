id: what-if-timeline-cn
title: 假如 · AI 时间线生成器
prompt: |
  标题：假如 · 时间线生成器（What If Timeline Generator 中文版）
  提示词：
  创建一个单页应用，使用单个 HTML 文件，基于 React 和 Remotion 实现一个“假如”风格的视频时间线生成器，所有界面文字翻译为中文。
  
  核心功能：
  - 用户可选择公司标签（Roblox、微软、Apple、WebSim、Protegent、辛普森、Animaniacs、地球、自定义）。
  - 输入提示词后，调用 AI 生成包含多个阶段的时间线场景。
  - 每个阶段包含：时间标签、难度等级、描述文本、缩略图。
  - 支持手动创建/编辑/删除阶段，以及缩略图选择器。
  
  难度系统：
  - 内置 80+ 种难度等级，从“非常非常开心”到“微软烂泥”，每种难度关联特定背景音乐和颜色。
  - 难度影响播放时的视觉效果（颜色边框、滤镜强度）。
  - “彻底熟了”和“绝对熟了”难度有特殊的烹饪动画效果。
  
  视频播放：
  - 使用 Remotion Player 渲染时间线视频。
  - 支持自动播放、画质切换（超低画质模式）。
  - 每个阶段按设定时长依次播放，背景音乐随难度切换。
  
  界面布局：
  - 顶部导航栏：版本号、主题切换、设置入口。
  - 主菜单：Logo、公司标签页、提示词输入框、开始按钮。
  - 场景工作室：AI 生成面板（含高级设置）、手动创建面板（阶段列表）。
  - 播放器视图：全屏视频预览、扩展按钮。
  - 设置模态框：调整默认时长、主题等。
  
  技术要求：
  - 使用 React 18 + Remotion 4.x。
  - 通过 import map 导入依赖，无需构建步骤。
  - 字体使用 Comic Sans MS，回退至 Microsoft YaHei。
  - 支持深色/浅色主题切换。
  - 完全响应式，适配移动端。
  
  特色细节：
  - 微软标签页使用多色渐变强调色。
  - 辛普森标签页强制使用 Homer 缩略图。
  - 支持 /extend 等斜杠命令（在提示词中输入可快速操作）。
  - 底部显示版本信息和引擎标识。
