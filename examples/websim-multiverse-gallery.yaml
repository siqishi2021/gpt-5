id: websim-multiverse-gallery
title: 多重宇宙画廊
prompt: |
  生成一个单页 HTML 画廊“多重宇宙画廊”：
  1. 网格展示卡片（至少50张），深色主题，红色强调色
  2. 卡片包含图片区域和中文名称
  3. 实现以下点击特效：
   - 故障闪烁：特定卡片名称持续随机乱码，点击恢复
   - 杀手卡片：点击图片切换两张不同图片
   - 匕首投掷：点击特定卡片，飞刀飞向屏幕中央+伤害数字+红屏
   - 黑屏眼睛：点击特定卡片，5秒黑屏后浮现眼睛
   - 逃跑消失：点击 bab 卡片，弹气泡+角色飞走+卡片移除
   - X!联动：点击 X! 卡片名称，所有 X! 卡片高亮脉冲
   - 子弹射击：点击突变卡片，发射子弹飞向屏幕中央爆炸
  4. 彩虹文字、发光文字、故障抖动等视觉特效
  5. 纯 HTML/CSS/JS，中文界面，无需真实图片

  请生成完整代码。

