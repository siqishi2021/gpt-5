<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假如 · 时间线生成器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 2px solid #333;
      margin-bottom: 25px;
    }
    .header h1 { color: #ff0000; font-size: 1.8rem; text-shadow: 0 0 15px rgba(255,0,0,0.5); }
    .version { margin-left: auto; color: #666; font-size: 0.8rem; }
    
    /* 标签 */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }
    .tab {
      padding: 10px 18px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 25px;
      color: #ccc;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .tab:hover { background: #2a2a2a; }
    .tab.active { background: #ff0000; border-color: #ff0000; color: #fff; }
    
    /* 卡片 */
    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
    }
    .card h3 {
      color: #ff0000;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* 输入框 */
    .input-row { display: flex; gap: 10px; }
    .input-field {
      flex: 1;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
    }
    .input-field::placeholder { color: #666; }
    
    /* 按钮 */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #00cc00; color: #fff; box-shadow: 0 4px 0 #008800; }
    .btn-red { background: #ff0000; color: #fff; box-shadow: 0 4px 0 #990000; }
    .btn-ghost { background: transparent; border: 1px dashed #555; color: #aaa; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* 高级设置 */
    .advanced {
      margin-top: 20px;
      padding: 15px;
      background: #0a0a0a;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }
    .setting label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
    .setting select, .setting input {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
    }
    
    /* 阶段列表 */
    .step-item {
      display: flex;
      gap: 15px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .step-thumb {
      width: 100px;
      height: 70px;
      background: #333;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 2px solid #444;
    }
    .step-content { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .step-content input, .step-content select, .step-content textarea {
      padding: 8px 12px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
    }
    .step-content textarea { min-height: 45px; resize: vertical; }
    .step-delete {
      background: none;
      border: none;
      color: #ff4444;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0 10px;
    }
    
    /* 时间线预览 */
    .timeline-step {
      display: flex;
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid #333;
    }
    .timeline-step:last-child { border: none; }
    .timeline-thumb {
      width: 140px;
      height: 80px;
      border-radius: 10px;
      background-size: cover;
      background-position: center;
      border: 3px solid;
      flex-shrink: 0;
    }
    .timeline-content { flex: 1; }
    .timeline-time { font-size: 1.8rem; font-weight: bold; margin-bottom: 5px; }
    .timeline-diff {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .timeline-desc { opacity: 0.85; }
    
    /* 辅助 */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .gap-10 { gap: 10px; }
    .mt-20 { margin-top: 20px; }
    .mb-20 { margin-bottom: 20px; }
    .loading {
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 40px; color: #666; }
    .footer { text-align: center; padding: 20px; color: #555; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 主菜单视图 -->
    <div id="view-menu">
      <div class="header">
        <h1>🎬 假如 · 时间线</h1>
        <span class="version">v1.0 中文版</span>
      </div>

      <div class="tabs" id="company-tabs">
        <!-- 动态生成 -->
      </div>

      <div class="card">
        <h3>✨ AI 智能生成</h3>
        <div class="input-row">
          <input type="text" class="input-field" id="prompt-input" placeholder="假如：Roblox 移除了聊天功能...">
          <button class="btn btn-primary" id="generate-btn">🚀 生成</button>
        </div>

        <button class="btn btn-ghost mt-20" id="toggle-advanced">⚙️ 高级设置</button>

        <div class="advanced hidden" id="advanced-panel">
          <div class="setting">
            <label>时长</label>
            <select id="length-select">
              <option value="4">短 (4阶段)</option>
              <option value="7" selected>中等 (7阶段)</option>
              <option value="12">长 (12阶段)</option>
              <option value="20">超长 (20阶段)</option>
            </select>
          </div>
          <div class="setting">
            <label>风格</label>
            <select id="style-select">
              <option>人性化</option>
              <option>混乱/梗图</option>
              <option>专业文档</option>
              <option>恐怖故事</option>
            </select>
          </div>
          <div class="setting">
            <label>结局</label>
            <select id="ending-select">
              <option>好结局</option>
              <option>普通结局</option>
              <option>坏结局</option>
            </select>
          </div>
          <div class="setting">
            <label>自定义阶段数</label>
            <input type="number" id="custom-stages" placeholder="留空自动" min="1" max="30">
          </div>
        </div>
      </div>

      <div class="card">
        <h3>📝 手动创建</h3>
        <button class="btn btn-red" id="manual-start">➕ 从零开始构建</button>
      </div>

      <div class="footer">Bg0 风格 · 假如时间线引擎</div>
    </div>

    <!-- 工作室视图 -->
    <div id="view-studio" class="hidden">
      <div class="header">
        <button class="btn btn-ghost" id="back-to-menu-1">← 返回</button>
        <h1>📋 场景工作室</h1>
        <span class="version" id="company-display">Roblox</span>
      </div>

      <div class="card">
        <div class="flex" style="justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin:0;">阶段列表 (<span id="step-count">0</span>)</h3>
          <button class="btn btn-primary" id="add-step-btn">➕ 添加阶段</button>
        </div>

        <div id="steps-container">
          <!-- 动态生成 -->
        </div>

        <button class="btn btn-red" style="width:100%; margin-top:20px; padding:15px;" id="preview-btn">▶️ 预览时间线</button>
      </div>
    </div>

    <!-- 时间线预览视图 -->
    <div id="view-timeline" class="hidden">
      <div class="header">
        <button class="btn btn-ghost" id="back-to-studio">← 返回编辑</button>
        <h1>📺 时间线预览</h1>
        <button class="btn btn-primary" id="extend-btn">✨ 扩展5阶段</button>
      </div>

      <div class="card">
        <h3 id="timeline-title">Roblox 的时间线</h3>
        <div id="timeline-container">
          <!-- 动态生成 -->
        </div>
      </div>

      <div class="flex gap-10" style="justify-content: center;">
        <button class="btn btn-primary" id="back-to-menu-2">🏠 返回主页</button>
        <button class="btn btn-ghost" id="back-to-studio-2">✏️ 继续编辑</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      // ==================== 数据 ====================
      const DIFFICULTIES = [
        "非常非常开心", "非常开心", "开心", "有点简单", "普通/简单",
        "普通", "困难", "更加困难", "疯狂/不可能", "极度困难",
        "彻底熟了", "绝对熟了", "故障", "微软烂泥", "深度油炸"
      ];

      const DIFFICULTY_COLORS = {
        "非常非常开心": "#cfff9a", "非常开心": "#a8ff7a", "开心": "#00ff00",
        "普通/简单": "#ffff00", "普通": "#99aabb", "困难": "#ff5500",
        "疯狂/不可能": "#ff0000", "极度困难": "#880000",
        "彻底熟了": "#c75a00", "绝对熟了": "#ff6f00", "故障": "#6d00ff",
        "微软烂泥": "#3a0000", "深度油炸": "#ff3300"
      };

      const THUMBNAILS = [
        "https://placehold.co/600x400/333/fff?text=🎮+游戏",
        "https://placehold.co/600x400/225/fff?text=💻+科技",
        "https://placehold.co/600x400/522/fff?text=🎵+音乐",
        "https://placehold.co/600x400/252/fff?text=📱+移动",
        "https://placehold.co/600x400/151/fff?text=🌐+网络"
      ];

      const COMPANIES = ["Roblox", "微软", "Apple", "WebSim", "自定义"];

      // ==================== 状态 ====================
      let currentCompany = "Roblox";
      let currentPrompt = "";
      let steps = [];
      let isLoading = false;
      let editingStepIndex = -1;

      // UI 元素
      const viewMenu = document.getElementById('view-menu');
      const viewStudio = document.getElementById('view-studio');
      const viewTimeline = document.getElementById('view-timeline');
      
      // ==================== 辅助函数 ====================
      function showView(view) {
        viewMenu.classList.add('hidden');
        viewStudio.classList.add('hidden');
        viewTimeline.classList.add('hidden');
        document.getElementById(`view-${view}`).classList.remove('hidden');
      }

      function getDifficultyColor(diff) {
        return DIFFICULTY_COLORS[diff] || '#888888';
      }

      // ==================== 渲染公司标签 ====================
      function renderCompanyTabs() {
        const container = document.getElementById('company-tabs');
        container.innerHTML = COMPANIES.map(c => 
          `<span class="tab ${c === currentCompany ? 'active' : ''}" data-company="${c}">${c}</span>`
        ).join('');
        
        container.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => {
            currentCompany = tab.dataset.company;
            renderCompanyTabs();
            updatePlaceholder();
          });
        });
      }

      function updatePlaceholder() {
        document.getElementById('prompt-input').placeholder = `假如：${currentCompany} 做了什么...`;
        document.getElementById('company-display').textContent = currentCompany;
      }

      // ==================== 渲染阶段列表 ====================
      function renderSteps() {
        const container = document.getElementById('steps-container');
        const countSpan = document.getElementById('step-count');
        
        countSpan.textContent = steps.length;
        
        if (steps.length === 0) {
          container.innerHTML = '<div class="empty-state">还没有阶段，点击"添加阶段"开始构建</div>';
          return;
        }
        
        container.innerHTML = steps.map((step, idx) => `
          <div class="step-item" data-index="${idx}">
            <div class="step-thumb" style="background-image: url('${step.thumbnail || THUMBNAILS[0]}')"></div>
            <div class="step-content">
              <input type="text" placeholder="时间标签" value="${step.timeLabel || ''}" data-field="timeLabel" data-index="${idx}">
              <select data-field="difficulty" data-index="${idx}">
                ${DIFFICULTIES.map(d => `<option value="${d}" ${step.difficulty === d ? 'selected' : ''}>${d}</option>`).join('')}
              </select>
              <textarea placeholder="描述..." data-field="description" data-index="${idx}">${step.description || ''}</textarea>
            </div>
            <button class="step-delete" data-index="${idx}">🗑️</button>
          </div>
        `).join('');
        
        // 绑定事件
        container.querySelectorAll('[data-field]').forEach(el => {
          el.addEventListener('change', (e) => {
            const idx = parseInt(el.dataset.index);
            const field = el.dataset.field;
            steps[idx][field] = e.target.value;
          });
        });
        
        container.querySelectorAll('.step-delete').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.index);
            steps.splice(idx, 1);
            renderSteps();
          });
        });
      }

      // ==================== 渲染时间线 ====================
      function renderTimeline() {
        const container = document.getElementById('timeline-container');
        const title = document.getElementById('timeline-title');
        
        title.textContent = currentPrompt || `${currentCompany} 的时间线`;
        
        if (steps.length === 0) {
          container.innerHTML = '<div class="empty-state">暂无阶段</div>';
          return;
        }
        
        container.innerHTML = steps.map(step => `
          <div class="timeline-step">
            <div class="timeline-thumb" style="background-image: url('${step.thumbnail || THUMBNAILS[0]}'); border-color: ${getDifficultyColor(step.difficulty)}"></div>
            <div class="timeline-content">
              <div class="timeline-time">${step.timeLabel || '某时刻'}</div>
              <span class="timeline-diff" style="background: ${getDifficultyColor(step.difficulty)}; color: #000">${step.difficulty || '普通'}</span>
              <div class="timeline-desc">${step.description || '等待描述...'}</div>
            </div>
          </div>
        `).join('');
      }

      // ==================== AI 生成 ====================
      async function generateScenario(isExtension = false) {
        if (isLoading) return;
        
        const promptInput = document.getElementById('prompt-input');
        currentPrompt = promptInput.value.trim() || `${currentCompany} 的时间线`;
        
        const lengthSelect = document.getElementById('length-select');
        const styleSelect = document.getElementById('style-select');
        const endingSelect = document.getElementById('ending-select');
        const customStages = document.getElementById('custom-stages');
        
        let count = isExtension ? 5 : (parseInt(customStages.value) || parseInt(lengthSelect.value) || 7);
        
        const generateBtn = document.getElementById('generate-btn');
        const extendBtn = document.getElementById('extend-btn');
        
        isLoading = true;
        if (generateBtn) generateBtn.disabled = true;
        if (extendBtn) extendBtn.disabled = true;
        
        try {
          // 模拟 AI 生成（如果 websim 不可用，使用本地生成）
          let newSteps = [];
          
          if (typeof websim !== 'undefined' && websim.chat) {
            const messages = [{
              role: "system",
              content: `生成 ${count} 个时间线阶段。主题：${currentPrompt}。风格：${styleSelect.value}。结局：${endingSelect.value}。返回 JSON：{"steps":[{"timeLabel":"1年后","description":"描述","difficulty":"普通","thumbnail":"url"}]}`
            }];
            const completion = await websim.chat.completions.create({ messages, json: true });
            const data = JSON.parse(completion.content);
            newSteps = data.steps || [];
          } else {
            // 本地模拟生成
            const timeLabels = ["1周后", "1个月后", "3个月后", "半年后", "1年后", "2年后", "5年后", "10年后"];
            const descs = [
              "社区开始出现不满情绪", "官方发布紧急补丁", "玩家数量大幅下降",
              "竞争对手趁机崛起", "公司召开紧急会议", "宣布重大改革",
              "老玩家纷纷回归", "新功能引发热议", "股价剧烈波动"
            ];
            
            for (let i = 0; i < count; i++) {
              newSteps.push({
                timeLabel: timeLabels[i % timeLabels.length] + (i >= timeLabels.length ? ` (${Math.floor(i/timeLabels.length)+1})` : ''),
                description: descs[Math.floor(Math.random() * descs.length)],
                difficulty: DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)],
                thumbnail: THUMBNAILS[Math.floor(Math.random() * THUMBNAILS.length)]
              });
            }
          }
          
          if (isExtension) {
            steps = [...steps, ...newSteps];
          } else {
            steps = newSteps;
          }
          
          renderSteps();
          renderTimeline();
          
          if (!isExtension) {
            showView('timeline');
          } else {
            renderTimeline();
          }
          
        } catch (e) {
          alert('生成失败：' + e.message);
          console.error(e);
        } finally {
          isLoading = false;
          if (generateBtn) generateBtn.disabled = false;
          if (extendBtn) extendBtn.disabled = false;
        }
      }

      // ==================== 初始化 ====================
      function init() {
        renderCompanyTabs();
        updatePlaceholder();
        
        // 高级设置切换
        document.getElementById('toggle-advanced').addEventListener('click', () => {
          document.getElementById('advanced-panel').classList.toggle('hidden');
        });
        
        // 生成按钮
        document.getElementById('generate-btn').addEventListener('click', () => generateScenario(false));
        
        // 手动开始
        document.getElementById('manual-start').addEventListener('click', () => {
          steps = [];
          renderSteps();
          showView('studio');
        });
        
        // 返回菜单
        document.getElementById('back-to-menu-1').addEventListener('click', () => showView('menu'));
        document.getElementById('back-to-menu-2').addEventListener('click', () => showView('menu'));
        
        // 返回工作室
        document.getElementById('back-to-studio').addEventListener('click', () => {
          renderSteps();
          showView('studio');
        });
        document.getElementById('back-to-studio-2').addEventListener('click', () => {
          renderSteps();
          showView('studio');
        });
        
        // 添加阶段
        document.getElementById('add-step-btn').addEventListener('click', () => {
          steps.push({
            timeLabel: steps.length === 0 ? '开始' : '之后',
            description: '新阶段...',
            difficulty: '普通/简单',
            thumbnail: THUMBNAILS[0]
          });
          renderSteps();
        });
        
        // 预览
        document.getElementById('preview-btn').addEventListener('click', () => {
          renderTimeline();
          showView('timeline');
        });
        
        // 扩展
        document.getElementById('extend-btn').addEventListener('click', () => generateScenario(true));
        
        // 回车生成
        document.getElementById('prompt-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') generateScenario(false);
        });
        
        // 默认显示菜单
        showView('menu');
      }

      init();
    })();
  </script>
</body>
</html>
