<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>多重宇宙中的 WebSim 用户们 ✦ 异世界画廊</title>

  <style>
    :root {
      --red: #c62828;
      --dark: #111;
      --muted: #e6e6e6;
      --card-bg: #1a1a1a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #2b2b2b 0%, #151515 100%);
      color: var(--muted);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 头部 */
    .site-header {
      background: var(--red);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .site-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: lowercase;
    }

    .container {
      padding: 12px;
      flex: 1 1 auto;
      display: flex;
      justify-content: center;
    }

    /* 画廊网格 */
    .gallery {
      width: 100%;
      max-width: 980px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      align-items: start;
    }

    /* 卡片 */
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 140px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .card:active, .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.55);
    }
    .thumb {
      background: linear-gradient(180deg,#2b2b2b,#111);
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      object-fit: cover;
      flex: 1 1 auto;
      min-height: 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .placeholder {
      background: linear-gradient(135deg,#2a2a2a,#141414);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.06);
      font-weight: 700;
      font-size: 18px;
    }

    /* 说明文字 */
    .caption {
      padding: 8px 10px;
      font-size: 12px;
      color: #fff;
      background: transparent;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .caption .secret-link, .secret-link {
      color: inherit;
      text-decoration: none;
      display: inline-block;
    }

    /* 彩虹昵称 */
    .caption .rainbow {
      display: inline-block;
      background: linear-gradient(90deg, #ff3b3b, #ff8a00, #ffdd00, #3bff6e, #00d2ff, #8a6bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }

    /* 故障效果 */
    .thumb.glitch {
      animation: glitch-shift 800ms infinite;
      will-change: transform, filter;
      backface-visibility: hidden;
    }

    @keyframes glitch-shift {
      0% { transform: translateX(0) skewX(0deg); filter: contrast(1) hue-rotate(0deg); }
      10% { transform: translateX(-4px) skewX(-1deg); filter: hue-rotate(-6deg) saturate(1.1); }
      20% { transform: translateX(3px) skewX(1deg); filter: hue-rotate(6deg) saturate(1.05); }
      30% { transform: translateX(0) skewX(0deg); filter: hue-rotate(0deg); }
      100% { transform: translateX(0) skewX(0deg); }
    }

    /* 首张卡片高亮 */
    .card.first {
      border: 2px solid rgba(255,255,255,0.06);
      box-shadow: 0 10px 26px rgba(198,40,40,0.14);
    }

    /* 响应式 */
    @media (max-width: 420px) {
      .site-header h1 { font-size: 14px; }
      .gallery { gap: 10px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
      .caption { font-size: 11px; padding: 6px; }
    }

    /* 匕首投掷动画 + 伤害数字 + 红闪 */
    .rust-knife {
      position: fixed;
      pointer-events: none;
      width: 48px;
      height: 48px;
      background: url('https://3a_cgvvnsxrwvjkpckt4.c.websim.com/2026_04_08_0fs_Kleki.png') center/contain no-repeat;
      transform-origin: center;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.06s linear;
    }
    @keyframes throw-knife {
      0% { transform: translate(var(--sx,0), var(--sy,0)) rotate(0deg) scale(1); opacity: 1; }
      60% { transform: translate(var(--tx,0), var(--ty,0)) rotate(720deg) scale(1.05); opacity: 1; }
      100% { transform: translate(calc(var(--tx,0) + 8px), calc(var(--ty,0) + 8px)) rotate(900deg) scale(0.9); opacity: 0; }
    }
    .damage-pop {
      position: fixed;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 10001;
      font-weight: 800;
      color: #ffb3b3;
      text-shadow: 0 0 10px rgba(255,50,50,0.9);
      font-size: 36px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.06s linear, transform 0.28s cubic-bezier(0.2,0.9,0.3,1);
    }
    .damage-pop.animate {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(-24px) scale(1.06);
    }
    .red-pulse-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, rgba(255,60,60,0.18), rgba(255,30,30,0.12) 25%, rgba(0,0,0,0) 55%);
      pointer-events: none;
      z-index: 10000;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .red-pulse-overlay.show { opacity: 1; transition: opacity 0.06s ease; }

    /* 对话气泡 */
    .speech-bubble {
      position: fixed;
      z-index: 12000;
      background: rgba(30,30,30,0.96);
      color: #ffdede;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.6);
      font-weight: 700;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1);
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.18s cubic-bezier(0.2,0.9,0.3,1);
    }
    .speech-bubble.show {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(-6px) scale(1.03);
    }

    /* 黑屏+眼睛揭示 */
    .blackout-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 13000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s linear;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blackout-overlay.show { opacity: 1; }
    .help-eye {
      width: 160px;
      height: auto;
      opacity: 0;
      transform: scale(0.86);
      transition: opacity 0.12s linear, transform 0.18s cubic-bezier(0.2,0.9,0.3,1);
      mix-blend-mode: screen;
    }
    .help-eye.show { opacity: 1; transform: scale(1); }

    /* X! 紫色光效 */
    .caption .xname {
      color: #c08bff;
      text-shadow: 0 0 8px rgba(176,107,255,0.9);
      font-weight: 700;
      cursor: pointer;
      display: inline-block;
    }
    .card.x-glow {
      box-shadow: 0 14px 34px rgba(176,107,255,0.16), 0 0 28px rgba(176,107,255,0.18) !important;
    }

    /* 其他特效样式 (精简保留关键) */
    .caption .evil-red, .caption .bright-red, .caption .red-glow,
    .caption .light-blue, .caption .green-glow, .caption .purple-pink-glow,
    .caption .vhs-red-glow, .caption .dark-text, .proximity-dark-overlay {
      /* 保留原有特效定义，略冗长但保持功能 */
    }
    .proximity-dark-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 14500;
      opacity: 0;
      transition: opacity 0.08s linear;
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>

    function makeCard({ imgSrc, caption, isFirst = false, glitch = false }) {

        media = document.createElement('img');

        media.alt = caption || '画像';
        media.className = 'thumb';
        if (glitch) media.classList.add('glitch');
      } else {
        media = document.createElement('div');
        media.className = 'thumb placeholder';
        media.textContent = '🖤';
      }
      card.appendChild(media);
      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = caption || '等待降临';
      card.appendChild(cap);
      return card;
    }

    // 4. 核心！sundialforgrace

    // 5. 清新！magicred
    gallery.appendChild(makeCard({ imgSrc: 'https://3a_cgvvnsxrwvjkpckt4.c.websim.com/2026_04_06_0wk_Kleki.png', caption: '清新！magicred' }));

    gallery.appendChild(killerCard);

    gallery.appendChild(helpCard);
    function setupGlitchCaption(card, baseText) {
      const cap = card.querySelector('.caption');
      if (!cap) return;
      const glyphs = ['@','#','%','&','?','¥','*','~','/','\\','|','!'];
      let running = true;
      setInterval(() => {
        if (!running) return;
        let txt = baseText.split('').map(ch => {
          if (Math.random() < 0.18) return glyphs[Math.floor(Math.random() * glyphs.length)];
          if (Math.random() < 0.12) return ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase();
          return ch;
        }).join('');
        cap.textContent = txt;
      }, 100);
      cap.addEventListener('click', () => { cap.textContent = baseText; running = false; setTimeout(()=> running = true, 800); });
    }
    setupGlitchCaption(helpCard, '救命灯泡');

    gallery.appendChild(makeCard({ imgSrc: 'https://3a_cgvvnsxrwvjkpckt4.c.websim.com/2026_04_08_0tt_Kleki.png', caption: 'X！playerz' }));
    gallery.appendChild(makeCard({ imgSrc: 'https://3a_cgvvnsxrwvjkpckt4.c.websim.com/2026_04_08_0bk_Kleki.png', caption: '尘尘坠落尘尘坠落杀手恐怖！马里奥最棒' }));
