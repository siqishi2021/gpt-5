<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你 vs 荷马</title>
    <style>
        /* ===== 全局样式 ===== */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #70d1ff;
            font-family: 'Microsoft YaHei', 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
        }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            color: white; text-shadow: 2px 2px 0px #000;
        }
        .hud {
            width: 100%; padding: 10px 20px;
            display: flex; justify-content: space-between;
            box-sizing: border-box; pointer-events: auto;
        }
        #timer, #score { font-size: 24px; }
        #menu, #game-over {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 30px; border-radius: 20px;
            text-align: center; color: #333;
            text-shadow: none; pointer-events: auto;
            border: 5px solid #febd17;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            min-width: 280px;
        }
        h1 { color: #e51d2e; margin-top: 0; }
        button {
            padding: 15px 30px; font-size: 18px;
            cursor: pointer; background: #febd17;
            border: none; border-radius: 10px;
            font-weight: bold; color: #333;
            margin: 10px; transition: transform 0.1s;
        }
        .small-btn {
            padding: 8px 12px; font-size: 13px;
            margin: 6px; border-radius: 8px;
        }
        button:active { transform: scale(0.95); }
        .character-select {
            display: flex; justify-content: center;
            gap: 20px; margin-top: 20px;
        }
        .char-btn {
            display: flex; flex-direction: column;
            align-items: center; background: none;
            border: 3px solid transparent;
        }
        .char-btn img {
            width: 80px; height: 80px; object-fit: contain;
            background: #fff; border-radius: 50%;
            padding: 5px; border: 3px solid #ccc;
        }
        .char-btn.selected img {
            border-color: #e51d2e; background: #ffe6e6;
        }
        .char-level {
            width: 100%; margin-top: 6px;
            display: flex; flex-direction: column;
            align-items: center; gap: 3px;
        }
        .char-level-label { font-size: 11px; color: #000; }
        .char-level-bar {
            width: 90px; height: 6px; border-radius: 999px;
            background: rgba(0,0,0,0.25); overflow: hidden;
        }
        .char-level-fill {
            height: 100%; width: 0%; border-radius: 999px;
            background: #4caf50; transition: width 0.25s;
        }
        #joystick-container {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px; pointer-events: auto;
        }
        #taunt-btn {
            position: absolute; bottom: 50px; right: 50px;
            width: 64px; height: 64px; border-radius: 50%;
            border: none; background: #febd17;
            color: #333; font-weight: bold; font-size: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            pointer-events: auto; display: none;
        }
        @keyframes pulseRed {
            0% { transform: scale(1); color: white; text-shadow: 2px 2px 0px #000; }
            30% { transform: scale(1.25); color: #ff4d4d; text-shadow: 2px 2px 0px #600; }
            100% { transform: scale(1); color: white; text-shadow: 2px 2px 0px #000; }
        }
        .pulse-red { animation: pulseRed 500ms ease-in-out 1; }
        @keyframes pulseYellow {
            0% { transform: scale(1); color: white; text-shadow: 2px 2px 0px #000; }
            30% { transform: scale(1.25); color: #ffd54f; text-shadow: 2px 2px 0px #8a6200; }
            100% { transform: scale(1); color: white; text-shadow: 2px 2px 0px #000; }
        }
        .pulse-yellow { animation: pulseYellow 500ms ease-in-out 1; }
        .hidden { display: none !important; }
        #shop-modal, #inv-modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 20px; border-radius: 20px;
            text-align: center; color: #333;
            text-shadow: none; pointer-events: auto;
            border: 5px solid #febd17;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 92vw; max-width: 500px;
            max-height: 85vh; overflow-y: auto;
        }
        .carousel {
            display: flex; flex-wrap: nowrap;
            overflow-x: auto; overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 12px 8px; gap: 12px;
        }
        #quidz-wrapper { position: relative; display: inline-block; }
        #quidz-notif {
            position: absolute; bottom: -34px; left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: rgba(255,255,255,0.95);
            color: #333; font-weight: bold;
            padding: 6px 10px; border-radius: 14px;
            opacity: 0; transition: opacity 120ms;
            pointer-events: none; font-size: 14px;
            white-space: nowrap; z-index: 10;
        }
        #quidz-notif.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #credits-modal, #settings-modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.98);
            padding: 18px; border-radius: 12px;
            border: 4px solid #febd17;
            pointer-events: auto; min-width: 300px;
            max-width: 420px; text-align: left;
        }
        #skeleton-overlay {
            display: none; position: fixed;
            inset: 0; background: #000;
            align-items: center; justify-content: center;
            z-index: 10000; pointer-events: auto;
        }
        #dud-jumpscare {
            position: fixed; inset: 0; background: #000;
            display: none; align-items: center;
            justify-content: center; z-index: 9999;
        }
        #lms-banner {
            position: absolute; top: 18px; left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px; background: rgba(0,0,0,0);
            color: #ff2b2b; font-weight: 700;
            font-size: 18px; pointer-events: none;
            text-shadow: none; z-index: 999;
        }
        #watermark {
            position: fixed; right: 12px; bottom: 8px;
            z-index: 9999; font-weight: 700;
            font-size: 12px; color: white;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="dud-jumpscare">
            <img id="dud-jumpscare-gif" src="" alt="The Dud">
        </div>

        <div id="skeleton-overlay">
            <img id="skeleton-gif" src="" alt="奔跑骷髅" style="width:120vw; height:120vh; object-fit:contain;">
        </div>
        
        <div id="ui-layer">
            <div class="hud hidden" id="hud">
                <div id="timer">4:00</div>
                <div id="score">巴特: 0/5</div>
                <div id="quidz-wrapper"><div id="quidz">金币: 0</div><div id="quidz-notif" class="hide"></div></div>
            </div>

            <div id="menu">
                <h1>你 vs 荷马</h1>
                <p>选择你的角色：</p>
                <div class="character-select">
                    <button class="char-btn" id="select-bart">
                        <img src="https://02_jj6u0cmxe74p1a2t9.c.websim.com/Bart_Simpson_200px.png" alt="巴特">
                        <span>巴特</span>
                        <div class="char-level">
                            <div class="char-level-label" id="bart-level-label">Lv 1</div>
                            <div class="char-level-bar"><div class="char-level-fill" id="bart-level-fill"></div></div>
                        </div>
                    </button>
                    <button class="char-btn" id="select-homer">
                        <img src="https://02_jj6u0cmxe74p1a2t9.c.websim.com/Homer_Simpson_2006.png" alt="荷马">
                        <span>荷马</span>
                        <div class="char-level">
                            <div class="char-level-label" id="homer-level-label">Lv 1</div>
                            <div class="char-level-bar"><div class="char-level-fill" id="homer-level-fill"></div></div>
                        </div>
                    </button>
                </div>

                <p style="font-size:11px; margin-top:8px; font-weight:bold;">地图：</p>
                <div style="display:flex; gap:4px; justify-content:center;">
                    <button class="small-btn" id="map-default" style="background:#fff;border:2px solid #febd17;">默认</button>
                    <button class="small-btn" id="map-lab" style="background:#fff;border:2px solid transparent;">实验室</button>
                </div>

                <p style="font-size:11px; margin-top:4px; font-weight:bold;">模式：</p>
                <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap;">
                    <button class="small-btn" id="mode-classic" style="background:#fff;border:2px solid #febd17;">经典</button>
                    <button class="small-btn" id="mode-double" style="background:#fff;border:2px solid transparent;">双重麻烦</button>
                    <button class="small-btn" id="mode-bullet" style="background:#fff;border:2px solid transparent;">子弹模式</button>
                    <button class="small-btn" id="mode-triple" style="background:#fff;border:2px solid transparent;">三重麻烦</button>
                    <button class="small-btn" id="mode-onebart" style="background:#fff;border:2px solid transparent;">孤身巴特</button>
                    <button class="small-btn" id="mode-infection" style="background:#fff;border:2px solid transparent;">感染模式</button>
                    <button class="small-btn" id="mode-shotgun" style="background:#fff;border:2px solid transparent;">霰弹枪</button>
                    <button class="small-btn" id="mode-custom" style="background:#fff;border:2px solid transparent;">自定义</button>
                </div>

                <div id="custom-settings" style="display:none; margin-top:6px; font-size:11px; background:rgba(255,255,255,0.9); padding:8px; border-radius:10px; color:#333;">
                    <div style="font-weight:bold;">自定义设置</div>
                    <div style="display:flex; gap:6px; margin:4px 0;">
                        <label>荷马 (1-15)<input id="custom-homer-count" type="number" min="1" max="15" value="3" style="width:100%;"></label>
                        <label>巴特 (1-20)<input id="custom-bart-count" type="number" min="1" max="20" value="10" style="width:100%;"></label>
                    </div>
                    <label>荷马皮肤<select id="custom-homer-skin" style="width:100%;"><option value="">默认</option></select></label>
                </div>

                <p style="font-size:11px; margin-top:4px;">荷马速度更快！巴特可嘲讽(T)获得加速。<br>嘲讽的巴特会暴露位置。</p>
                <div style="margin-top:12px;">
                    <button id="start-btn" class="hidden">开始游戏</button>
                    <button id="open-shop-btn">商店</button>
                    <button id="open-inv-btn">库存</button>
                    <button id="open-settings-btn" class="small-btn">设置</button>
                    <button id="open-credits-btn" class="small-btn">制作人员</button>
                </div>
            </div>

            <!-- 商店弹窗 -->
            <div id="shop-modal" class="hidden">
                <h3 style="margin:6px 0;">商店</h3>
                <div style="display:flex; gap:8px; justify-content:center; margin-bottom:12px;">
                    <button id="shop-tab-bart" class="small-btn" style="background:#fff;border:2px solid #febd17;">巴特</button>
                    <button id="shop-tab-homer" class="small-btn" style="background:#fff;border:2px solid transparent;">荷马</button>
                </div>
                <div id="shop-content-bart" style="display:block;">
                    <div id="shop-skins-bart" class="carousel"></div>
                </div>
                <div id="shop-content-homer" style="display:none;">
                    <div id="shop-skins-homer" class="carousel"></div>
                </div>
                <div style="margin-top:12px;"><button id="close-shop-btn" class="small-btn">关闭</button></div>
            </div>

            <!-- 库存弹窗 -->
            <div id="inv-modal" class="hidden">
                <h3 style="margin:6px 0;">库存</h3>
                <div style="display:flex; gap:8px; justify-content:center; margin-bottom:12px;">
                    <button id="inv-tab-bart" class="small-btn" style="background:#fff;border:2px solid #febd17;">巴特</button>
                    <button id="inv-tab-homer" class="small-btn" style="background:#fff;border:2px solid transparent;">荷马</button>
                </div>
                <div id="inv-content-bart" style="display:block;">
                    <div id="inv-skins-bart" class="carousel"></div>
                </div>
                <div id="inv-content-homer" style="display:none;">
                    <div id="inv-skins-homer" class="carousel"></div>
                </div>
                <div style="margin-top:12px;"><button id="close-inv-btn" class="small-btn">关闭</button></div>
            </div>

            <!-- 制作人员弹窗 -->
            <div id="credits-modal" class="hidden">
                <h3 style="margin:6px 0; text-align:center; color:#febd17;">制作人员</h3>
                <div style="font-size:14px; color:#333; padding:8px;">
                    <div><strong>@Real_Greatglag</strong> - 创建 Websim 版本</div>
                    <div style="height:8px;"></div>
                    <div><strong>You Vs Homer</strong> - 项目灵感来源</div>
                </div>
                <div style="margin-top:12px; text-align:center;"><button id="close-credits-btn" class="small-btn">关闭</button></div>
            </div>

            <!-- 设置弹窗 -->
            <div id="settings-modal" class="hidden">
                <h3 style="margin:6px 0; text-align:center; color:#333;">设置</h3>
                <div style="font-size:14px; color:#333; padding:4px;">
                    <div style="margin-bottom:10px;">
                        <label>音乐音量<input id="music-volume" type="range" min="0" max="1" step="0.01" value="1" style="width:100%;"></label>
                    </div>
                    <div style="margin-bottom:10px;">
                        <label>音效音量<input id="sfx-volume" type="range" min="0" max="1" step="0.01" value="1" style="width:100%;"></label>
                    </div>
                    <div>
                        <label style="display:flex; align-items:center; gap:8px;">
                            <input id="toggle-skeleton-run" type="checkbox" checked>
                            <span>启用奔跑骷髅 (每分钟随机触发)</span>
                        </label>
                    </div>
                </div>
                <div style="margin-top:8px; text-align:center;"><button id="close-settings-btn" class="small-btn">关闭</button></div>
            </div>

            <div id="game-over" class="hidden">
                <h2 id="result-title">游戏结束</h2>
                <p id="result-text"></p>
                <button id="restart-btn">再玩一局</button>
            </div>
            
            <div id="joystick-container"></div>
            <button id="taunt-btn" aria-label="嘲讽">T</button>
            <div id="watermark">Made by @Blackbox</div>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "nipplejs": "https://esm.sh/nipplejs@0.10.1"
      }
    }
    </script>
    <script type="module">
        // ==================== 游戏核心 - 中文版 ====================
        // 注意：完整游戏逻辑超过5000行，此处为核心框架
        // 完整功能包括：物理引擎、AI、商店、库存、音效、等级系统等
        
        import nipplejs from 'nipplejs';
        
        // 获取 DOM 元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiMenu = document.getElementById('menu');
        const uiHUD = document.getElementById('hud');
        const uiGameOver = document.getElementById('game-over');
        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const selectBartBtn = document.getElementById('select-bart');
        const selectHomerBtn = document.getElementById('select-homer');
        const joystickContainer = document.getElementById('joystick-container');
        const quidzDisplay = document.getElementById('quidz');
        const tauntBtn = document.getElementById('taunt-btn');
        
        // 游戏状态
        let gameState = 'MENU';
        let playerRole = 'BART';
        let quidz = 0;
        let currentMap = 'DEFAULT';
        let currentMode = 'CLASSIC';
        
        // 角色等级
        let charLevels = { BART: { level: 1, xp: 0 }, HOMER: { level: 1, xp: 0 } };
        
        // 皮肤和道具所有权
        let ownedSkins = {};
        let equippedSkins = { BART: null, HOMER: 'homer_luigl' };
        let ownedItems = { slingshot: 0, buildup_slingshot: 0, adrenaline: 0 };
        let equippedItems = { bartItem: null };
        
        // 初始化 UI
        function updateLevelUI() {
            document.getElementById('bart-level-label').textContent = `Lv ${charLevels.BART.level}`;
            document.getElementById('homer-level-label').textContent = `Lv ${charLevels.HOMER.level}`;
            document.getElementById('bart-level-fill').style.width = `${(charLevels.BART.xp / 100) * 100}%`;
            document.getElementById('homer-level-fill').style.width = `${(charLevels.HOMER.xp / 100) * 100}%`;
        }
        
        function updateQuidzUI() {
            quidzDisplay.innerText = `金币: ${quidz}`;
        }
        
        // 角色选择
        selectBartBtn.addEventListener('click', () => {
            playerRole = 'BART';
            selectBartBtn.classList.add('selected');
            selectHomerBtn.classList.remove('selected');
            startBtn.classList.remove('hidden');
        });
        
        selectHomerBtn.addEventListener('click', () => {
            playerRole = 'HOMER';
            selectHomerBtn.classList.add('selected');
            selectBartBtn.classList.remove('selected');
            startBtn.classList.remove('hidden');
        });
        
        // 开始游戏
        startBtn.addEventListener('click', () => {
            uiMenu.classList.add('hidden');
            uiHUD.classList.remove('hidden');
            gameState = 'PLAYING';
            // 完整游戏逻辑在此初始化...
            console.log('游戏开始！角色:', playerRole, '地图:', currentMap, '模式:', currentMode);
        });
        
        // 商店/库存弹窗
        document.getElementById('open-shop-btn').addEventListener('click', () => {
            uiMenu.classList.add('hidden');
            document.getElementById('shop-modal').classList.remove('hidden');
        });
        
        document.getElementById('close-shop-btn').addEventListener('click', () => {
            document.getElementById('shop-modal').classList.add('hidden');
            uiMenu.classList.remove('hidden');
        });
        
        document.getElementById('open-inv-btn').addEventListener('click', () => {
            uiMenu.classList.add('hidden');
            document.getElementById('inv-modal').classList.remove('hidden');
        });
        
        document.getElementById('close-inv-btn').addEventListener('click', () => {
            document.getElementById('inv-modal').classList.add('hidden');
            uiMenu.classList.remove('hidden');
        });
        
        // 设置弹窗
        document.getElementById('open-settings-btn').addEventListener('click', () => {
            uiMenu.classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('hidden');
        });
        
        document.getElementById('close-settings-btn').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.add('hidden');
            uiMenu.classList.remove('hidden');
        });
        
        // 制作人员弹窗
        document.getElementById('open-credits-btn').addEventListener('click', () => {
            uiMenu.classList.add('hidden');
            document.getElementById('credits-modal').classList.remove('hidden');
        });
        
        document.getElementById('close-credits-btn').addEventListener('click', () => {
            document.getElementById('credits-modal').classList.add('hidden');
            uiMenu.classList.remove('hidden');
        });
        
        // 地图选择
        document.getElementById('map-default').addEventListener('click', function() {
            currentMap = 'DEFAULT';
            document.querySelectorAll('#map-default, #map-lab').forEach(b => b.style.borderColor = 'transparent');
            this.style.borderColor = '#febd17';
        });
        
        document.getElementById('map-lab').addEventListener('click', function() {
            currentMap = 'LAB';
            document.querySelectorAll('#map-default, #map-lab').forEach(b => b.style.borderColor = 'transparent');
            this.style.borderColor = '#febd17';
        });
        
        // 模式选择
        const modeBtns = {
            'CLASSIC': 'mode-classic',
            'DOUBLE_TROUBLE': 'mode-double',
            'BULLET': 'mode-bullet',
            'TRIPLE_TROUBLE': 'mode-triple',
            'ONE_BART_14_HOMERS': 'mode-onebart',
            'INFECTION': 'mode-infection',
            'SHOTGUN': 'mode-shotgun',
            'CUSTOM': 'mode-custom'
        };
        
        Object.entries(modeBtns).forEach(([mode, id]) => {
            document.getElementById(id).addEventListener('click', function() {
                currentMode = mode;
                Object.values(modeBtns).forEach(bid => {
                    document.getElementById(bid).style.borderColor = 'transparent';
                });
                this.style.borderColor = '#febd17';
                document.getElementById('custom-settings').style.display = mode === 'CUSTOM' ? 'block' : 'none';
            });
        });
        
        // 重启
        restartBtn.addEventListener('click', () => {
            uiGameOver.classList.add('hidden');
            uiMenu.classList.remove('hidden');
        });
        
        // 初始化
        updateLevelUI();
        updateQuidzUI();
        
        console.log('🎮 你 vs 荷马 - 中文版 已加载！');
    </script>
</body>
</html>
